<svg xmlns="http://www.w3.org/2000/svg" width="323" height="72" viewBox="0 0 323 72" role="img" aria-labelledby="logo-title">
  <title id="logo-title">TECHSEVEN</title>
  <desc>A split seven and lightning monogram with a modern TECHSEVEN wordmark.</desc>

  <!-- ICON TIA SÉT SỐ 7 (GIỮ NGUYÊN GỐC) -->
  <path fill="#ffe000" d="M11 8H62L52 22H2Z"/>
  <path fill="#0756c9" d="M28 27H54L25 63H7L25 41H17Z"/>

  <!-- CHỮ TECHSEVEN CHÍNH (TÔNG XANH ĐẬM & XANH ĐIỆN MÁY CHO NỀN SÁNG) -->
  <text x="72" y="40"
        font-family="'Segoe UI', 'Roboto', 'Montserrat', 'Helvetica Neue', Arial, sans-serif"
        font-size="34"
        font-weight="900"
        font-style="italic"
        letter-spacing="0.5">
    <tspan fill="#0f294a">TECH</tspan><tspan fill="#0046be">SEVEN</tspan>
  </text>

  <!-- THANH NHẤN TỐC ĐỘ & DÒNG TAGLINE PHỤ BÊN DƯỚI -->
  <path fill="#ffe000" d="M73 49H96L93 55H70Z"/>
  <text x="103" y="56"
        fill="#475569"
        font-family="'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif"
        font-size="10"
        font-weight="700"
        letter-spacing="2.2">ĐIỆN MÁY CHÍNH HÃNG</text>
</svg>