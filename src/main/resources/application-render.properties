# Small instance defaults; keep regular local development settings unchanged.
server.address=0.0.0.0
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:12}
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=64
server.tomcat.accept-count=20

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=1

# JSPs are immutable inside the Docker image; skip development reload checks.
server.servlet.jsp.init-parameters.development=false
