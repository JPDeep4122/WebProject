spring.application.name=dienmay-shop

# Cấu hình JSP View Resolver
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Cấu hình gửi Mail qua Gmail SMTP (JavaMailSender)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Kết nối Neon (PostgreSQL)
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Upload ảnh sản phẩm
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Cấu hình JWT (JSON Web Token)
dienmay.app.jwtSecret=${JWT_SECRET:}
dienmay.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# Google Maps Routes API (enable Routes API and billing in Google Cloud)
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}

