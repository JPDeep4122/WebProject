services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env.docker}
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    entrypoint: ["/bin/bash", "/scripts/init-database.sh"]
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-dienmay_db}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env.docker}
    volumes:
      - ./docker/init-database.sh:/scripts/init-database.sh:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:sqlserver://db:1433;databaseName=${DB_NAME:-dienmay_db};encrypt=true;trustServerCertificate=true;
      DB_USERNAME: ${DB_USERNAME:-sa}
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env.docker}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.docker}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  sqlserver_data:
